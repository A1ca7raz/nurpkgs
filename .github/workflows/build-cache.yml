name: "[Auto] Build binary cache"

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  nix_conf: |
    keep-env-derivations = true
    keep-outputs = true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.detect.outputs.entries }}

    steps:
      - name: 0-1. Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 0-2. Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: ${{ env.nix_conf }}

      - name: 1-1. Detect packages to build
        id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual run: build everything.
            entries=$(
              for o in packages legacyPackages checks; do
                nix eval --json ".#$o.x86_64-linux" --apply 'builtins.attrNames' \
                  | jq --arg o "$o" -r '.[] | "\($o).\(.)"'
              done | jq -R . | jq -sc .
            )
          else
            # Push: build only what actually changed (drvPath diff).
            entries=$(.github/scripts/drv-diff.sh "${{ github.event.before }}" "${{ github.sha }}")
          fi
          entries=$(jq -c 'map(split(".") | {output: .[0], package: (.[1:] | join("."))})' <<< "$entries")
          echo "entries=$entries" >> "$GITHUB_OUTPUT"
          echo "Changed entries: $entries"

  build:
    needs: detect
    if: ${{ needs.detect.outputs.entries != '' && needs.detect.outputs.entries != '[]' }}
    secrets: inherit
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.detect.outputs.entries) }}
    uses: ./.github/workflows/builder.yml
    with:
      output: ${{ matrix.entry.output }}
      package: ${{ matrix.entry.package }}
      push_cache: true
      pre_check: false

  post-build:
    needs: [ build ]
    # Notify on a finished build only: empty matrix (skipped) and superseded
    # runs (cancelled by a newer push) stay silent.
    if: ${{ always() && github.event_name == 'push' && (needs.build.result == 'success' || needs.build.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: 0-1. Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: 0-2. Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Generate notification message
        id: notify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.build.result }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_TS: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          short_sha=${COMMIT_SHA:0:7}
          commit_date="${COMMIT_TS:0:4}${COMMIT_TS:5:2}${COMMIT_TS:8:2}"

          # Per-leg results; matrix legs are named
          # "build (<output>, <package>) / build".
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq \
            '.jobs[] | select(.name | startswith("build (")) | [.name, .conclusion, .html_url] | @tsv' \
            > legs.tsv

          # Package versions at the built commit, per flake output.
          for out in packages legacyPackages checks; do
            nix eval --json ".#$out.x86_64-linux" --apply \
              'builtins.mapAttrs (n: p: (builtins.tryEval (p.version or "")).value)' \
              > "versions-$out.json"
          done

          # Telegram legacy markdown parses _, *, `, [ in bare text.
          # shellcheck disable=SC2016
          esc() { printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/_/\\_/g' -e 's/\*/\\*/g' -e 's/`/\\`/g' -e 's/\[/\\[/g'; }

          total=0; failed=0
          : > entries.tsv
          while IFS=$'\t' read -r leg conclusion url; do
            spec=${leg#build (}; spec=${spec%) / build}
            out=${spec%%, *}; pkg=${spec#*, }
            ver=$(jq -r --arg n "$pkg" '.[$n] // ""' "versions-$out.json")
            name="*$(esc "$pkg")*"
            if [ "$conclusion" = success ]; then
              if [ -n "$ver" ]; then line="🟢 $name: $(esc "$ver")"; else line="🟢 $name"; fi
            else
              failed=$((failed + 1))
              if [ -n "$ver" ]; then line="🔴 $name: [$(esc "$ver")]($url) FAILED"; else line="🔴 $name: [FAILED]($url)"; fi
            fi
            total=$((total + 1))
            printf '%s\t%s\n' "$out.$pkg" "$line" >> entries.tsv
          done < legs.tsv

          if [ "$failed" -eq 0 ]; then
            header="nurpkgs@[$short_sha ($commit_date)]($COMMIT_URL): $total built"
          else
            header="nurpkgs@[$short_sha ($commit_date)]($COMMIT_URL): $failed/$total FAILED"
          fi

          {
            echo 'message<<EOF'
            echo "$header"
            echo
            sort -t $'\t' -k1,1 entries.tsv | cut -f2-
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Send notification
        env:
          RECEIVER_ID: ${{ secrets.TG_RECEIVER_ID }}
          BOT_KEY: ${{ secrets.TG_BOT_KEY }}
          MESSAGE: ${{ steps.notify.outputs.message }}
        run: |
          # Pin <2: apprise 2.0.0 rewrites Telegram markdown and escapes
          # the ``` fences and link brackets, so messages arrive unparsed.
          pip install "apprise<2"
          apprise -vv -b "$MESSAGE" "tgram://$BOT_KEY/$RECEIVER_ID/?format=markdown" || true
