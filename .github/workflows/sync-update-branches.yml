name: "[Auto] Sync update branches"

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Shared with update.yml: both create and force-push update/* branches,
  # so they must never run at the same time.
  group: update-branch-maintenance
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  nix_conf: |
    keep-env-derivations = true
    keep-outputs = true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 0-1. Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PR_PAT }}

      - name: 0-2. Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: ${{ env.nix_conf }}

      - name: 0-3. Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Decide which open update branches this main change affects:
      #   all    - a whitelisted primary flake input moved
      #   source - some packages' build code changed (derivation diff);
      #            only the source branches of the updaters owning those
      #            packages are rebuilt
      #   none   - irrelevant change (docs, CI, non-primary lock entries):
      #            exit without touching anything
      - name: 1-1. Classify main changes
        id: classify
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mode=""
          targets=""

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # Manual dispatch: full sync.
            mode=all
          else
            git show "$BEFORE:flake.lock" > /tmp/base.lock
            for i in $(jq -r '.primaryFlakeInputs[]' .github/ci-config.json); do
              if [ "$(.github/scripts/lock-rev-info.sh /tmp/base.lock "$i")" \
                != "$(.github/scripts/lock-rev-info.sh flake.lock "$i")" ]; then
                mode=all
                break
              fi
            done

            if [ -z "$mode" ] \
              && ! git diff --quiet "$BEFORE" HEAD -- ':!flake.lock' ':!.github'; then
              # A package's build code changed iff its drvPath changed.
              wt=$(mktemp -d)
              git worktree add --detach "$wt" "$BEFORE" > /dev/null 2>&1
              before=$(cd "$wt" && nix eval --json .#packages.x86_64-linux --apply \
                'builtins.mapAttrs (n: p: (builtins.tryEval p.drvPath).value)')
              git worktree remove --force "$wt"
              after=$(nix eval --json .#packages.x86_64-linux --apply \
                'builtins.mapAttrs (n: p: (builtins.tryEval p.drvPath).value)')
              changed=$(jq -cn --argjson b "$before" --argjson a "$after" \
                '(($b | keys) + ($a | keys)) | unique | map(select($b[.] != $a[.]))')
              if [ "$changed" != "[]" ]; then
                targets=$(nix eval --json .#updater.x86_64-linux \
                  --apply 'builtins.mapAttrs (n: u: u.packages)' \
                  | jq -r --argjson changed "$changed" '
                    to_entries[]
                    | select(.value | any(. as $p | ($changed | index($p)) != null))
                    | .key')
              fi
              if [ -n "$targets" ]; then
                mode=source
              fi
            fi
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          {
            echo 'targets<<EOF'
            echo "$targets"
            echo EOF
          } >> "$GITHUB_OUTPUT"
          echo "Classification: mode='${mode:-none}' targets: ${targets:-none}"

      - name: 1-2. Rebuild open update branches on top of main
        if: steps.classify.outputs.mode != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PR_PAT }}
          MODE: ${{ steps.classify.outputs.mode }}
          TARGETS: ${{ steps.classify.outputs.targets }}
        run: |
          set -euo pipefail

          prs=$(gh pr list --base main --limit 100 --json number,headRefName \
            --jq '.[] | select(.headRefName | test("^update/(flake|source)/")) | "\(.number)\t\(.headRefName)"')
          if [ -z "$prs" ]; then
            echo "No open update PRs."
            exit 0
          fi

          while IFS=$'\t' read -r number branch; do
            rest=${branch#update/}
            type=${rest%%/*}
            name=${rest#*/}

            if [ "$MODE" = source ]; then
              if [ "$type" != source ] || ! grep -qx "$name" <<< "$TARGETS"; then
                continue
              fi
            fi
            echo "=== Syncing $branch (PR #$number) ==="

            # update/flake/primary covers every whitelisted input.
            inputs=$name
            if [ "$type" = flake ] && [ "$name" = primary ]; then
              inputs=$(jq -r '.primaryFlakeInputs[]' .github/ci-config.json)
            fi

            git fetch origin "+$branch:refs/remotes/origin/$branch"
            old_head=$(git rev-parse "origin/$branch")

            # --- versions at the PR branch's old head ---
            wt=$(mktemp -d)
            git worktree add --detach "$wt" "$old_head" > /dev/null 2>&1
            if [ "$type" = flake ]; then
              : > /tmp/flake_before.txt
              for i in $inputs; do
                echo "$i|$(.github/scripts/lock-rev-info.sh "$wt/flake.lock" "$i")" >> /tmp/flake_before.txt
              done
            else
              (
                cd "$wt"
                for p in $(nix eval --json ".#updater.x86_64-linux.$name.packages" | jq -r '.[]'); do
                  v=$(nix eval --raw ".#packages.x86_64-linux.$p.version" 2>/dev/null || echo '?')
                  echo "$p $v"
                done
              ) | sort > /tmp/versions_before.txt
            fi
            git worktree remove --force "$wt"

            # --- rebuild on top of main (no rebase) ---
            git checkout -B "$branch" origin/main
            ok=true
            if [ "$type" = flake ]; then
              for i in $inputs; do
                nix flake lock --update-input "$i" || ok=false
              done
            else
              nix run ".#updater.x86_64-linux.$name.script" || ok=false
            fi
            if [ "$ok" != true ]; then
              echo "Rebuild failed for $branch; leaving branch untouched."
              # actions/checkout leaves a detached HEAD, so a local "main"
              # branch may not exist; reset via the remote-tracking ref.
              git checkout -f --detach origin/main
              continue
            fi

            if git status --porcelain | grep -q .; then
              git add -A
              git commit -m "$branch: rebuild on latest main"
            fi
            if [ "$(git rev-parse "HEAD^{tree}")" = "$(git rev-parse "$old_head^{tree}")" ]; then
              # update.yml already rebuilt this branch on the same main.
              echo "Rebuild is identical to the current branch head; skipping push."
              git checkout -f --detach origin/main
              continue
            fi
            # If the rebuild produced no diff against main the branch now
            # equals main and the PR closes itself on push.
            git push -f origin "$branch"

            # --- sync PR title/body if the version range changed ---
            if [ "$type" = flake ]; then
              : > /tmp/flake_after.txt
              for i in $inputs; do
                echo "$i|$(.github/scripts/lock-rev-info.sh flake.lock "$i")" >> /tmp/flake_after.txt
              done
              if ! diff -q /tmp/flake_before.txt /tmp/flake_after.txt > /dev/null; then
                git show origin/main:flake.lock > /tmp/base.lock
                if [ "$name" = primary ]; then
                  np_old=$(jq -r '.nodes.nixpkgs.locked | "\(.rev[:7])-\(.lastModified | todate | .[:10] | gsub("-"; ""))"' /tmp/base.lock)
                  np_new=$(jq -r '.nodes.nixpkgs.locked | "\(.rev[:7])-\(.lastModified | todate | .[:10] | gsub("-"; ""))"' flake.lock)
                  title="nixpkgs: $np_old -> $np_new"
                else
                  old_short=$(jq -r --arg n "$name" '.nodes[$n].locked | "\(.rev[:7])-\(.lastModified | todate | .[:10] | gsub("-"; ""))"' /tmp/base.lock)
                  new_short=$(jq -r --arg n "$name" '.nodes[$n].locked | "\(.rev[:7])-\(.lastModified | todate | .[:10] | gsub("-"; ""))"' flake.lock)
                  title="$name: $old_short -> $new_short"
                fi
                body="### Changelog of flake inputs"$'\n'
                for i in $inputs; do
                  base_rev=$(.github/scripts/lock-rev-info.sh /tmp/base.lock "$i")
                  after_rev=$(.github/scripts/lock-rev-info.sh flake.lock "$i")
                  if [ "$base_rev" != "$after_rev" ]; then
                    body="$body$(printf -- '- **%s**: %s -> %s\n' "$i" "$base_rev" "$after_rev")"
                  fi
                done
                gh pr edit "$number" --title "$title" --body "$body"
                echo "PR #$number updated: $title"
              fi
            else
              : > /tmp/versions_after.txt
              for p in $(nix eval --json ".#updater.x86_64-linux.$name.packages" | jq -r '.[]'); do
                v=$(nix eval --raw ".#packages.x86_64-linux.$p.version" 2>/dev/null || echo '?')
                echo "$p $v" >> /tmp/versions_after.txt
              done
              sort -o /tmp/versions_after.txt /tmp/versions_after.txt
              if ! diff -q /tmp/versions_before.txt /tmp/versions_after.txt > /dev/null; then
                count=$(wc -l < /tmp/versions_after.txt)
                if [ "$count" -eq 1 ]; then
                  oldv=$(awk 'NR==1 {print $2}' /tmp/versions_before.txt)
                  newv=$(awk 'NR==1 {print $2}' /tmp/versions_after.txt)
                  title="$name: $oldv -> $newv"
                else
                  title="$name: bump $count packages"
                fi
                body="### Changelog of packages"$'\n'$(join /tmp/versions_before.txt /tmp/versions_after.txt \
                  | awk '{printf "- **%s**: %s -> %s\n", $1, $2, $3}')
                gh pr edit "$number" --title "$title" --body "$body"
                echo "PR #$number updated: $title"
              fi
            fi
          done <<< "$prs"
