name: "[PR] Build check"

on:
  pull_request_target:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  nix_conf: |
    keep-env-derivations = true
    keep-outputs = true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.detect.outputs.entries }}
    steps:
      - name: 0-1. Checkout
        uses: actions/checkout@v7
        with:
          # pull_request_target + head checkout: this repo accepts
          # same-repo PRs only, so checking out head code is acceptable.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: 0-2. Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: ${{ env.nix_conf }}

      - name: 1-1. Diff derivation paths (base vs head)
        id: detect
        run: |
          entries=$(.github/scripts/drv-diff.sh \
            "${{ github.event.pull_request.base.sha }}" HEAD \
            | jq -c 'map(split(".") | {output: .[0], package: (.[1:] | join("."))})')
          echo "entries=$entries" >> "$GITHUB_OUTPUT"
          echo "Changed entries: $entries"

  build:
    needs: detect
    if: ${{ needs.detect.outputs.entries != '' && needs.detect.outputs.entries != '[]' }}
    secrets: inherit
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.detect.outputs.entries) }}
    uses: ./.github/workflows/builder.yml
    with:
      output: ${{ matrix.entry.output }}
      package: ${{ matrix.entry.package }}
      ref: ${{ github.event.pull_request.head.sha }}
      push_cache: false
      pre_check: false
